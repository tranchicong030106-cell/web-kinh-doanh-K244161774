<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bài 49 - Online Classified</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <main class="classified-card">
    <h1>Online Classifieds Search Form</h1>
    <hr>

    <form id="classifiedForm">
      <section>
        <h3>1) Search for a classified in the following sections:</h3>
        <div class="two-cols">
          <label><input type="radio" name="section"> Employment</label>
          <label><input type="radio" name="section"> Personal</label>
          <label><input type="radio" name="section" checked> For Sale</label>
          <label><input type="radio" name="section"> Miscellaneous</label>
          <label><input type="radio" name="section"> Housing</label>
          <label><input type="radio" name="section"> All of the above</label>
        </div>
      </section>

      <section>
        <h3>2) Search the following publications:</h3>
        <div class="three-cols">
          <label><input type="checkbox" checked> Midwest times</label>
          <label><input type="checkbox"> Modern News</label>
          <label><input type="checkbox"> Employment Today</label>
          <label><input type="checkbox" checked> Great Lakes Classifieds</label>
          <label><input type="checkbox"> Middleton Daily</label>
          <label><input type="checkbox"> Cashtown Daily News</label>
        </div>
      </section>

      <section class="dates">
        <h3>3) From to</h3>
        <input type="text" placeholder="mm/dd/yy">
        <span>to</span>
        <input type="text" placeholder="mm/dd/yy">
      </section>

      <section>
        <h3>4) Enter a few keywords to describe the classified.</h3>
        <input class="keywords" type="text">
      </section>

      <section>
        <h3>5) Click one of the options below:</h3>
        <div class="actions">
          <button type="button" id="searchBtn"><img src="hinh/Search.gif" alt="Search"></button>
          <button type="button" id="helpBtn"><img src="hinh/Help.gif" alt="Help"></button>
          <button type="button" id="cancelBtn"><img src="hinh/Cancel.gif" alt="Cancel"></button>
        </div>
      </section>
    </form>
  </main>
</body>
</html>
