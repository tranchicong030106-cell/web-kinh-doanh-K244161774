.box{width:610px;margin:auto;background:#c6f6f7;border:2px solid #2c6ea3;padding:10px 12px 22px}
h1{color:#ff3c37;font-size:24px;margin:6px 0 12px}
hr{border:0;border-top:1px solid #7baab0;margin-bottom:18px}
.section{font-weight:bold;margin:14px 0 9px}
.options{margin-left:8px;line-height:1.45}
.pub{display:grid;grid-template-columns:repeat(3,max-content);column-gap:18px;row-gap:2px}
.dates input{width:120px;height:22px}
.keywords{width:96%;height:24px}
.icons{display:flex;gap:22px;margin:12px 0 0 5px}
.iconBtn{border:0;background:transparent;padding:0;cursor:pointer;text-align:center;font-family:"Times New Roman",serif}
.iconBtn img{display:block;width:59px;height:auto;margin:auto}

function doSearch(){ alert("Search"); }
function doHelp(){ alert("Help: Hãy chọn mục cần tìm, ấn Search để thực hiện tìm kiếm."); }
function doCancel(){ document.getElementById("classifiedForm").reset(); }

<h1>Online Classifieds Search Form</h1>

        <label><input type="radio" name="section">Employment</label>
        &nbsp;&nbsp;<label><input type="radio" name="section">Personal</label><br>
        <label><input type="radio" name="section" checked>For Sale</label>
        &nbsp;&nbsp;&nbsp;&nbsp;<label><input type="radio" name="section">Miscellaneous</label><br>
        <label><input type="radio" name="section">Housing</label>
        &nbsp;&nbsp;&nbsp;<label><input type="radio" name="section">All of the above</label>
    </div>

    <div class="section">2) Search the following publications:</div>
    <div class="options pub">
        <label><input type="checkbox" checked>Midwest times</label>
        <label><input type="checkbox">Modern News</label>
        <label><input type="checkbox">Employment Today</label>
        <label><input type="checkbox" checked>Great Lakes Classifieds</label>
        <label><input type="checkbox">Middleton Daily</label>
        <label><input type="checkbox">Cashtown Daily News</label>
    </div>

    <div class="section dates">3) From to
        <input type="text" placeholder="mm/dd/yy">
        &nbsp;&nbsp;&nbsp; to
        <input type="text" placeholder="mm/dd/yy">
