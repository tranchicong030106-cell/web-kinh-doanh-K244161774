<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bài 48 - Register</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <main class="register-card">
    <img class="logo" src="hinh/Jackson.gif" alt="Jackson Electronics">
    <h2>Registration Form</h2>
    <p class="note">Register your Jackson Electronics product here</p>

    <form id="registerForm">
      <div class="row">
        <label>First Name:</label>
        <div><input type="text"> Last Name: <input type="text"></div>
      </div>
      <div class="row"><label>Address #1:</label><input class="wide" type="text"></div>
      <div class="row"><label>Address #2:</label><input class="wide" type="text"></div>
      <div class="row">
        <label>City:</label>
        <div><input type="text"> State: <input class="state" type="text"> Zip: <input class="zip" type="text"></div>
      </div>
      <div class="row">
        <label>Country:</label>
        <select><option>United States</option><option>Vietnam</option></select>
      </div>

      <hr>

      <div class="row">
        <label>Product:</label>
        <select><option>ScanMaster</option><option>LaserPrint 1000</option><option>AudioMax</option></select>
      </div>
      <div class="row"><label>Date Purchased:</label><input type="text"></div>
      <div class="row"><label>Serial #:</label><input type="text"></div>

      <div class="row">
        <label>Used for:</label>
        <div class="choices">
          <label><input type="radio" name="used"> Home</label>
          <label><input type="radio" name="used"> Educational Institution</label>
          <label><input type="radio" name="used"> Business</label>
          <label><input type="radio" name="used"> Other</label>
          <label><input type="radio" name="used"> Government</label>
        </div>
      </div>

      <div class="row">
        <label>System (check all that apply):</label>
        <div class="choices">
          <label><input type="checkbox"> Windows</label>
          <label><input type="checkbox"> UNIX</label>
          <label><input type="checkbox"> Macintosh</label>
          <label><input type="checkbox"> Other</label>
        </div>
      </div>

      <hr>

      <div class="row">
        <label>Comments?:</label>
        <textarea></textarea>
      </div>

      <div class="actions">
        <button type="submit">Click to register</button>
        <button type="button" id="cancelBtn">Click to cancel</button>
      </div>
    </form>
  </main>
</body>
</html>
