    <h2>Registration Form</h2>
    <div class="note">Register your Jackson Electronics product here</div>

    <form id="registerForm" onsubmit="registerForm(); return false;">
    <table>
        <tr><td>First Name:</td><td><input class="medium" type="text"> Last Name: <input class="medium" type="text"></td></tr>
        <tr><td>Address #1:</td><td><input class="long" type="text"></td></tr>
        <tr><td>Address #2:</td><td><input class="long" type="text"></td></tr>
        <tr><td>City:</td><td><input class="medium" type="text"> State: <input style="width:45px" type="text"> Zip: <input style="width:80px" type="text"></td></tr>
        <tr><td>Country:</td><td>
            <select class="medium"><option>United States</option><option>Vietnam</option><option>Canada</option><option>Japan</option></select>
        </td></tr>
        <tr><td colspan="2"><hr></td></tr>
        <tr><td>Product:</td><td>
            <select class="medium"><option>ScanMaster</option><option>LaserPrint 1000</option><option>AudioMax</option></select>
        </td></tr>
        <tr><td>Date Purchased:</td><td><input class="medium" type="text"></td></tr>
        <tr><td>Serial #:</td><td><input class="medium" type="text"></td></tr>
        <tr><td>Used for:</td><td>
            <div class="group">
                <span class="stack">
                    <label><input type="radio" name="used"> Home</label><br>
                    <label><input type="radio" name="used"> Business</label><br>
                    <label><input type="radio" name="used"> Government</label>
                </span>
                <span class="stack">
                    <label><input type="radio" name="used"> Educational Institution</label><br>
                    <label><input type="radio" name="used"> Other</label>
                </span>
            </div>
        </td></tr>
        <tr><td>System (check all that apply):</td><td>
            <div class="group">
                <span class="stack">
                    <label><input type="checkbox"> Windows</label><br>
                    <label><input type="checkbox"> Macintosh</label>
                </span>
                <span class="stack">
                    <label><input type="checkbox"> UNIX</label><br>
                    <label><input type="checkbox"> Other</label>
                </span>
            </div>
        </td></tr>
        <tr><td colspan="2"><hr></td></tr>
        <tr><td>Comments?:</td><td><textarea></textarea></td></tr>
    </table>
    <div class="actions">
        <button type="submit">Click to register</button>
        <button type="button" onclick="cancelForm()">Click to cancel</button>
    </div>
    </form>
</div>
